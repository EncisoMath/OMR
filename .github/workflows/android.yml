name: Android APK
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: RoqueOMR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Preparar PDFs A4
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar hojas de muestra
        run: |
          python -m pip install reportlab
          python scripts/make_samples.py --out-dir dist
      - name: Publicar APK y PDF en GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1.0 ya publicada."
          else
            gh release create v1.1.0 \
              "app/build/outputs/apk/debug/app-debug.apk#RoqueOMR_v1.1.0_debug.apk" \
              dist/RoqueOMR_Hoja_Muestra_40_Blanco.pdf \
              dist/RoqueOMR_Hoja_Muestra_40_Resuelta.pdf \
              --repo "$GITHUB_REPOSITORY" \
              --title "Roque OMR v1.1.0 - Beta" \
              --notes "Nueva cámara integrada CameraX: detección continua de 4 guías, autocaptura al estabilizarse y superposición de opciones marcadas sobre la imagen congelada. Incluye hojas de muestra. Beta: revisar antes de calificar oficialmente." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
