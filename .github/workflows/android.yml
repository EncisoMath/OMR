name: Build EncisoOMR APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: ls "$ANDROID_HOME/platforms" && ls "$ANDROID_HOME/build-tools"
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EncisoOMR-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0 "app/build/outputs/apk/debug/app-debug.apk#EncisoOMR-v0.1.0-debug.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.1.0 "app/build/outputs/apk/debug/app-debug.apk#EncisoOMR-v0.1.0-debug.apk" --repo "$GITHUB_REPOSITORY" --title "EncisoOMR v0.1.0 (beta)" --notes "Primera APK de prueba con Supabase. Motor OMR experimental; verifica las respuestas antes de usar notas." --prerelease
          fi
